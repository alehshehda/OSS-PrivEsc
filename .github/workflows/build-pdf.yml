name: Build LaTeX Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-pdf:
    name: Compile OSS-PrivEsc-project.pdf
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          args: -pdf -bibtex -interaction=nonstopmode -halt-on-error -jobname=OSS-PrivEsc-project

      - name: Verify PDF output
        run: test -s OSS-PrivEsc-project.pdf

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSS-PrivEsc-project
          path: OSS-PrivEsc-project.pdf
          retention-days: 14

  deploy-pages:
    name: Publish PDF to GitHub Pages
    needs: build-pdf
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: OSS-PrivEsc-project
          path: public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish PDF to GitHub Releases
    needs: build-pdf
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: OSS-PrivEsc-project

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release upload latest OSS-PrivEsc-project.pdf --clobber --repo "$REPO"
          else
            gh release create latest OSS-PrivEsc-project.pdf --title "Latest PDF Build" --notes "Automated LaTeX build from main." --repo "$REPO"
          fi
